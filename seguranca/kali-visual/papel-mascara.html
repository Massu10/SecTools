<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>mascara</title>
<!-- Papel de parede "Máscara verde" do Kali (desenho próprio, 1920x1080). Gerar o PNG com o Chrome sem janela:
     chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1920,1080 --screenshot=kali-mascara-verde.png file:///.../papel-mascara.html
     Mesmo desenho nas cores originais do Kali (para o "cores original"): ...papel-mascara.html#original -> kali-mascara-original.png
     (máscara com as cores de verdade, como a do terminal, e chuva, anel e textos no azul do Kali).
     Só a máscara (para a arte do terminal), 600x745: #mascara, #silhueta, #olhos, #tracos no fim do endereço. -->
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#010402}
#chuva,#cena{position:absolute;left:0;top:0}
.so-mascara body{background:#000}
.so-mascara #chuva,.so-mascara .extra{display:none}
.tracos body{background:#fff}
.tracos .pele{display:none}
text{font-family:Consolas,"Cascadia Mono",monospace}
</style></head>
<body>
<canvas id="chuva" width="1920" height="1080"></canvas>

<defs>

    <stop offset="0" stop-color="#f4f7ef"/>

  <linearGradient id="lados" x1="0" x2="1">
    <stop offset="0" stop-color="#0d1a10" stop-opacity=".6"/>
    <stop offset=".24" stop-color="#0d1a10" stop-opacity="0"/>
    <stop offset=".76" stop-color="#0d1a10" stop-opacity="0"/>
    <stop offset="1" stop-color="#0d1a10" stop-opacity=".6"/>
  </linearGradient>
  <linearGradient id="queixo" x1="0" y1="0" x2="0" y2="1">
    <stop offset=".62" stop-color="#0d1a10" stop-opacity="0"/>
    <stop offset="1" stop-color="#0d1a10" stop-opacity=".5"/>
  </linearGradient>
  <radialGradient id="bochecha">
    <stop offset="0" stop-color="#e2566e" stop-opacity=".55"/>
    <stop offset=".6" stop-color="#e2566e" stop-opacity=".2"/>
    <stop offset="1" stop-color="#e2566e" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="olhoLuz">

  <filter id="suave" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="aura" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="26"/></filter>
  <filter id="brilho" x="-20%" y="-80%" width="140%" height="260%">

  <filter id="brilhoOlho" x="-80%" y="-300%" width="260%" height="700%">

  <filter id="tingeVermelho"><feColorMatrix type="matrix" values=".45 .3 .2 0 .3  0 0 0 0 .02  0 0 0 0 .1  0 0 0 1 0"/></filter>

    <use href="#bigD" fill="#0a0c0a"/>
    <use href="#bigD" fill="#0a0c0a" transform="translate(600,0) scale(-1,1)"/>
    <path d="M236,492 C266,516 334,516 364,492" stroke="#253025" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M236,492 l-6,-7 M364,492 l6,-7" stroke="#253025" stroke-width="2.6" fill="none" stroke-linecap="round" opacity=".8"/>
    <ellipse class="pele" cx="300" cy="522" rx="34" ry="7" fill="#1b2a1e" opacity=".18" filter="url(#suave)"/>
    <path d="M293,522 C295,582 297,652 300,718 C303,652 305,582 307,522 C303,517 297,517 293,522 Z" fill="#0a0c0a"/>
  </g>
  <g id="olhosAcesos">
    <use href="#olhoE" fill="url(#olhoLuz)" filter="url(#brilhoOlho)" opacity=".9"/>
    <use href="#olhoE" fill="url(#olhoLuz)" filter="url(#brilhoOlho)" opacity=".9" transform="translate(600,0) scale(-1,1)"/>
  </g>
</defs>

  <circle cx="960" cy="482" r="412" stroke-width="1" stroke-dasharray="60 160 20 400" opacity=".4"/>
  <path d="M960,74 v22 M960,868 v22 M552,482 h22 M1346,482 h22" stroke-width="2" opacity=".6"/>
</g>

  <text x="1380" y="498" opacity=".6">0°07'29.5"W</text>

  <text x="540" y="498" text-anchor="end" opacity=".6">PÓLVORA // TRAIÇÃO</text>
  <text x="684" y="790" text-anchor="end">SINAL: CRIPTOGRAFADO</text>
</g>

<!-- máscara -->
<g id="palco" transform="translate(720,176) scale(.8)">

  <use id="usoMascara" href="#mascara"/>
  <use class="extra" href="#olhosAcesos"/>
  <use id="silh" href="#contorno" fill="#fff" style="display:none"/>
  <g id="soOlhos" style="display:none" fill="#fff"><use href="#olhoE"/><use href="#olhoE" transform="translate(600,0) scale(-1,1)"/></g>
</g>

<!-- falhas de sinal -->
<g class="extra">
  <g clip-path="url(#fatia1)"><g transform="translate(740,176) scale(.8)"><use href="#mascara" filter="url(#tingeVerde)"/></g></g>
  <g clip-path="url(#fatia2)" opacity=".6"><g transform="translate(706,176) scale(.8)"><use href="#mascara" filter="url(#tingeVermelho)"/></g></g>
  <g clip-path="url(#fatia3)"><g transform="translate(748,176) scale(.8)"><use href="#mascara" filter="url(#tingeVerde)"/></g></g>
  <g clip-path="url(#fatia4)"><g transform="translate(730,176) scale(.8)"><use href="#mascara" filter="url(#tingeVerde)"/></g></g>

  <text x="960" y="980" font-size="19" letter-spacing="2" fill="#2bd462" opacity=".85">ideias não morrem   //   conhecimento é livre   //   hackeie com ética</text>

</g>

<rect class="extra" width="1920" height="1080" fill="url(#linhas)"/>
</svg>
<script>
(function(){
  if (location.hash === '#mascara' || location.hash === '#silhueta' || location.hash === '#olhos' || location.hash === '#tracos') {
    document.documentElement.classList.add('so-mascara');
    if (location.hash === '#tracos') { document.documentElement.classList.add('tracos'); document.querySelectorAll('.pele').forEach(function (e) { e.remove(); }); }
    else if (location.hash !== '#mascara') {
      document.getElementById('usoMascara').style.display = 'none';
      document.getElementById(location.hash === '#silhueta' ? 'silh' : 'soOlhos').style.display = '';
    }
    var s = document.getElementById('cena');
    s.setAttribute('viewBox', '712 176 496 616');
    s.setAttribute('width', '600'); s.setAttribute('height', '745');
    return;
  }
  // #original: as mesmas peças nas cores originais do Kali (troca cor por cor; o desenho não muda)
  var original = location.hash === '#original';
  if (original) {
    var troca = {
      '#010402': '#07090e',                                                  // fundo
      '#f4f7ef': '#f8f3e8', '#dde4d6': '#e8dfcd', '#b3bfae': '#c9bca5', '#7f8e7b': '#8d7f6b',   // porcelana
      '#0d1a10': '#1f1812', '#1b2a1e': '#2e241c', '#56684f': '#6e6150', '#435043': '#5a4c3e',   // sombras
      '#253025': '#7d2733', '#020503': '#120e0c', '#0a0c0a': '#0c0a09',     // lábios vinho, olhos e bigode
      '#06200d': '#0b1a33', '#021008': '#050b18', '#1aff5c': '#367bf0',     // halo e aura
      '#2bff6e': '#4a9cff', '#3dff7a': '#5fa8ff', '#8dffb0': '#e8f0ff', '#2bd462': '#4a8fe6', '#1f7a3c': '#2c5aa0'
    };
    document.querySelectorAll('[fill],[stroke],[stop-color]').forEach(function (e) {
      ['fill', 'stroke', 'stop-color'].forEach(function (a) {
        var v = (e.getAttribute(a) || '').toLowerCase();
        if (troca[v]) e.setAttribute(a, troca[v]);
      });
    });
    document.querySelector('#tingeVerde feColorMatrix').setAttribute('values', '0 0 0 0 .08  0 0 0 0 .22  .25 .55 .2 0 .45  0 0 0 1 0');
    document.querySelectorAll('use[href="#olhosAcesos"]').forEach(function (e) { e.remove(); });   // olhos escuros, sem brilho
    document.documentElement.style.background = document.body.style.background = '#07090e';
  }
  var cor = original
    ? {fundo: '#07090e', solto: 'rgba(74,140,255,', brilho: '#5fa8ff', cabeca: 'rgba(225,238,255,',
       rastro: function (f, a) { return 'rgba(54,' + (110 + Math.floor(70 * f)) + ',240,' + a + ')'; }}
    : {fundo: '#010402', solto: 'rgba(40,255,110,', brilho: '#3dff7a', cabeca: 'rgba(215,255,228,',
       rastro: function (f, a) { return 'rgba(36,' + (180 + Math.floor(75 * f)) + ',96,' + a + ')'; }};
  function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  var R = rng(1105);
  var c = document.getElementById('chuva').getContext('2d');
  c.fillStyle = cor.fundo; c.fillRect(0, 0, 1920, 1080);
  var sim = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789ABCDEF:=+*<>';
  function ch(){ return sim[Math.floor(R()*sim.length)]; }
  function camada(tam, passo, forca, quedas){
    c.font = tam + 'px "MS Gothic", Consolas, monospace';
    c.textBaseline = 'top';
    var cols = Math.ceil(1920/passo), lins = Math.ceil(1080/(tam+2));
    for (var x = 0; x < cols; x++) {
      for (var y = 0; y < lins; y++) if (R() < .06) { c.fillStyle = cor.solto + (.03*forca) + ')'; c.fillText(ch(), x*passo, y*(tam+2)); }
      var n = R() < quedas ? (R() < .35 ? 2 : 1) : 0;
      for (var k = 0; k < n; k++) {
        var cab = Math.floor(R()*(lins+12)) - 4, L = 6 + Math.floor(R()*26), base = .45 + R()*.55;
        for (var i = 0; i < L; i++) {
          var lin = cab - i; if (lin < 0 || lin >= lins) continue;
          var a = Math.pow(1 - i/L, 1.5) * base * forca;
          if (i === 0) { c.shadowColor = cor.brilho; c.shadowBlur = 10; c.fillStyle = cor.cabeca + Math.min(1, forca*1.1) + ')'; }
          else { c.shadowBlur = 0; c.fillStyle = cor.rastro(1 - i/L, a); }
          c.fillText(ch(), x*passo, lin*(tam+2));
        }
        c.shadowBlur = 0;
      }
    }
  }
  camada(13, 15, .45, .55);
  camada(19, 24, .9, .5);
})();
</script>
</body></html>
